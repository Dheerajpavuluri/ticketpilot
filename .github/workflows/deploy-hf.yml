name: Deploy to Hugging Face

# Mirrors main to a Docker Space after CI passes.
# Setup: repo secret HF_TOKEN (write token) and repo variable HF_SPACE (e.g. "user/ticketpilot").
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ vars.HF_SPACE != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Space snapshot
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan hf-deploy
          # Spaces read their config from README front matter; binaries need LFS,
          # so the screenshot is served from GitHub instead of being pushed.
          sed -i 's#](docs/screenshot.png)#](https://raw.githubusercontent.com/${{ github.repository }}/main/docs/screenshot.png)#' README.md
          {
            printf -- '---\n'
            printf 'title: TicketPilot\n'
            printf 'emoji: 🎧\n'
            printf 'colorFrom: green\n'
            printf 'colorTo: blue\n'
            printf 'sdk: docker\n'
            printf 'app_port: 8000\n'
            printf 'short_description: AI support agent with tool calling, guardrails and evals\n'
            printf -- '---\n\n'
            cat README.md
          } > README.space.md
          mv README.space.md README.md
          git rm -r -q --cached docs
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"

      - name: Push to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push --force "https://hf:${HF_TOKEN}@huggingface.co/spaces/${{ vars.HF_SPACE }}" hf-deploy:main
